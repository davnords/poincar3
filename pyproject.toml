[project]
name = "poincar3"
version = "1.0.0"
description = "Emergent Multi-View Geometry Through Self-Distillation."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "David Nordström", email = "davnords@chalmers.se" }
]
requires-python = ">=3.10"
keywords = ["computer-vision", "self-supervised-learning", "multi-view", "3d", "vision-transformer"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The model itself needs nothing but torch. Everything else is an extra.
dependencies = [
    "numpy>=1.26",
    "torch",
]

[project.urls]
Homepage = "https://github.com/davnords/poincar3"
Repository = "https://github.com/davnords/poincar3"

[project.optional-dependencies]
# demo.py
demo = [
    "opencv-python>=4.12.0.88",
    "pillow>=10.0.0",
    "tyro",
]
# experiments/train.py, experiments/eval.py (mvcorr / see_se3) and
# experiments/attention_tracks.py.
train = [
    "poincar3[demo]",
    "h5py>=3.12.1",
    "matplotlib>=3.10.7",
    "rich>=14.2.0",
    "scipy>=1.15.3",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "wandb>=0.23.0",
]
# Additionally needed for `--evaluation matchbench` and the feed-forward
# reconstruction experiments.
eval = [
    "poincar3[train]",
    "flow-vis>=0.1",
    "kornia>=0.8.2",
    "loguru>=0.7.0",
    "openexr>=3.4.13",
    "romatch>=0.1.2",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
